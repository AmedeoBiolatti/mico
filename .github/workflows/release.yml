name: Release

# Pushing a tag v* builds mico on Ubuntu 24.04 for x86-64 and ARM64, runs the
# tests on each, and publishes a GitHub release: a tarball per architecture,
# their SHA-256 sums, and a provenance attestation tying each tarball to this
# workflow run and commit. A push to ci/** builds and tests the same way and
# publishes nothing, so a change to this file can be tried first.
on:
  push:
    tags: ['v*']
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: .github/scripts/install-linux-deps.sh

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4 --timeout 300

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          name="mico-${TAG//\//-}-linux-$ARCH"
          cmake --install build --prefix "$name"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mico-${{ matrix.arch }}
          path: mico-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestations
      attestations: write  # store them
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: mico-*
          merge-multiple: true

      - name: Checksums
        run: |
          sha256sum mico-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: mico-*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" mico-*.tar.gz SHA256SUMS --verify-tag --title "$TAG" --generate-notes
