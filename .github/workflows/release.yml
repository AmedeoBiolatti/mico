name: Release

# Pushing a tag v* builds mico on Ubuntu 24.04, runs the tests and publishes a
# GitHub release: the binary in a tarball, its SHA-256 sums, and a provenance
# attestation tying the tarball to this workflow run and commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: .github/scripts/install-linux-deps.sh

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4 --timeout 300

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="mico-$TAG-linux-x86_64"
          cmake --install build --prefix "$name"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: mico-*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" mico-*.tar.gz SHA256SUMS --verify-tag --title "$TAG" --generate-notes
