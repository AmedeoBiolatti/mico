name: CI

on:
  push:
    # ci/** branches run CI on push, so workflow changes can be tried before a PR.
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            cc: gcc-13
            cxx: g++-13
          - name: Linux Clang
            cc: clang-18
            cxx: clang++-18
            # LLVMgold, so ld can link clang's LTO objects.
            packages: llvm-18-linker-tools
          # Releases ship an ARM64 build too; char is unsigned there.
          - name: Linux ARM64 GCC
            runner: ubuntu-24.04-arm
            cc: gcc-13
            cxx: g++-13

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: .github/scripts/install-linux-deps.sh ${{ matrix.packages }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4 --timeout 300
