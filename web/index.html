<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>mico</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="banner" role="alert" hidden>Disconnected from mico — trying again…</div>
<div id="app" data-screen="list">
  <aside id="side" aria-label="Chats">
    <header id="brand">
      <span class="logo">mico</span>
      <span id="conn" class="conn off" title="Not connected" role="img" aria-label="connection"></span>
      <span id="count"></span>
      <select id="theme" aria-label="Theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="dracula">Dracula</option>
        <option value="warm">Warm</option>
        <option value="contrast">High contrast</option>
      </select>
    </header>
    <div class="search">
      <input id="filter" type="search" placeholder="Filter chats" autocomplete="off" autocapitalize="off"
             spellcheck="false" aria-label="Filter chats" enterkeyhint="search">
      <kbd title="Press / to filter">/</kbd>
    </div>
    <div id="side-scroll">
      <section id="running-sec">
        <h2>Running</h2>
        <div id="agents" class="list"></div>
      </section>
      <section>
        <h2>Folders</h2>
        <div id="folders"></div>
      </section>
    </div>
  </aside>
  <main id="main">
    <header id="chat-head" hidden>
      <button id="back" class="icon" type="button" aria-label="Back to chats">‹</button>
      <div class="titles">
        <div id="chat-title"></div>
        <div id="chat-meta"></div>
      </div>
      <div id="views" role="group" aria-label="How much of the work to show">
        <button type="button" data-view="minimal" title="Conversation only; steps folded to a line">Minimal</button>
        <button type="button" data-view="normal" title="Short runs of steps open">Normal</button>
        <button type="button" data-view="full" title="Every step, its output and the thinking">Full</button>
      </div>
      <button id="work-toggle" class="ghost" type="button" aria-controls="work-panel" aria-expanded="false">Work</button>
      <button id="interrupt" class="ghost" type="button" hidden title="Interrupt what it is doing (Esc)">Interrupt</button>
      <button id="stop" class="ghost danger" type="button" hidden>Stop</button>
    </header>
    <div id="chat-workspace">
    <div id="conversation">
    <div id="empty">
      <div class="empty-card">
        <div class="logo big">mico</div>
        <p id="empty-text">Pick a chat on the left, or start an agent in a folder with <b>+</b>.</p>
        <p class="tip">Press <kbd>/</kbd> to filter chats.</p>
      </div>
    </div>
    <div id="chat" tabindex="-1" hidden>
      <button id="older" type="button" hidden>Load older messages</button>
      <div id="events"></div>
      <div id="activity" hidden></div>
    </div>
    <button id="latest" type="button" hidden>↓ Latest</button>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="perm" role="alertdialog" aria-label="The agent needs your permission" hidden></div>
    <form id="prompt" hidden>
      <div class="box">
        <textarea id="prompt-text" rows="1" aria-label="Message" enterkeyhint="send"></textarea>
        <button id="send" type="submit" aria-label="Send" disabled>↑</button>
      </div>
      <div id="hint"></div>
    </form>
    <div id="resume-bar" hidden>
      <span>A stored chat.</span>
      <button id="resume" type="button" class="primary">Resume</button>
      <button id="fork" type="button">Fork</button>
    </div>
    </div>
    <aside id="work-panel" aria-label="Work" hidden>
      <header class="work-head"><strong>Work</strong><button id="work-close" class="ghost" type="button" aria-label="Close work panel">Close</button></header>
      <div id="work-tabs" role="tablist" aria-label="Work type">
        <button type="button" id="work-tab-agent" role="tab" data-kind="agent" aria-controls="work-content" aria-selected="true">Agents</button>
        <button type="button" id="work-tab-terminal" role="tab" data-kind="terminal" aria-controls="work-content" aria-selected="false">Terminals</button>
        <button type="button" id="work-tab-btw" role="tab" data-kind="btw" aria-controls="work-content" aria-selected="false">Btw</button>
      </div>
      <div id="work-content" role="tabpanel" aria-labelledby="work-tab-agent">
        <div id="work-list"></div>
        <div id="work-detail-head"><span id="work-title"></span><button id="work-source" class="ghost" type="button" hidden>Show in chat</button><button id="work-copy" class="ghost" type="button" hidden>Copy</button></div>
        <div id="work-output" tabindex="0" aria-label="Selected work output"></div>
        <div id="btw-history" hidden><button id="btw-previous" class="ghost" type="button">Previous answer</button><button id="btw-next" class="ghost" type="button">Next answer</button></div>
        <form id="btw-form" hidden><label for="btw-text">Ask a side question</label><div><input id="btw-text" type="text" autocomplete="off" placeholder="Btw…" required><button type="submit" class="primary">Ask</button></div></form>
      </div>
    </aside>
    </div>
  </main>
</div>
</body>
</html>
